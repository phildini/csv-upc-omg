name: CI - Library

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-lib.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-lib.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev
        working-directory: src

      - name: Run tests with coverage
        run: uv run pytest -v --cov=csv_upc_omg --cov=tests --cov-report=term-missing tests/
        working-directory: src

      - name: Run ruff check
        run: uv run ruff check csv_upc_omg/ tests/
        working-directory: src

      - name: Run ruff format check
        run: uv run ruff format --check csv_upc_omg/ tests/
        working-directory: src

      - name: Run mypy
        run: uv run mypy csv_upc_omg/
        working-directory: src
