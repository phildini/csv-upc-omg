name: CI - Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Build Tailwind CSS
        run: uv run python web/manage.py tailwind build

      - name: Ensure staticfiles directory exists
        run: mkdir -p staticfiles

      - name: Run Django system check
        run: uv run python web/manage.py check

      - name: Run web tests
        run: uv run python web/manage.py test inventory

      - name: Run ruff check on web
        run: uv run ruff check web/

      - name: Run ruff format check on web
        run: uv run ruff format --check web/

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: "latest"

      - name: Deploy to Fly.io
        run: |
          echo "Deploying to Fly.io..."
          flyctl version
          flyctl auth whoami --verbose
          flyctl deploy --app csv-upc-omg --config fly.toml --image-label latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
