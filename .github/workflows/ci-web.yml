name: CI - Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Build Tailwind CSS
        run: uv run python web/manage.py tailwind build

      - name: Ensure staticfiles directory exists
        run: mkdir -p staticfiles

      - name: Run Django system check
        run: uv run python web/manage.py check

      - name: Run web tests
        run: uv run python web/manage.py test inventory

      - name: Run ruff check on web
        run: uv run ruff check web/

      - name: Run ruff format check on web
        run: uv run ruff format --check web/

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: "latest"

      - name: Deploy to Fly.io
        id: deploy
        run: |
          flyctl deploy \
            --app csv-upc-omg \
            --config fly.toml \
            --image-label "${{ github.sha }}" \
            --strategy rolling \
            --verbose \
            --timeout 10m \
            2>&1 | tee deploy.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          flyctl status --app csv-upc-omg
          echo "Active machines:"
          flyctl machines list --app csv-upc-omg
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment issue detected, attempting rollback..."
          flyctl rollback --app csv-upc-omg 2>&1 || echo "Rollback not available — manual intervention may be needed"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
