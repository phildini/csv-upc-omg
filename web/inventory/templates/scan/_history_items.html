<div class="space-y-2">
  {% if scans %}
    {% for scan in scans|slice:":5" %}
    <div class="card bg-base-200 border border-base-300 shadow-sm">
      <div class="card-body py-2 px-3">
        <div class="font-mono text-xs">{{ scan.upc }}</div>
        {% if scan.product_title %}
        <div class="text-sm truncate">{{ scan.product_title }}</div>
        {% endif %}
        <span class="badge badge-{% if scan.status == 'success' %}success{% elif scan.status == 'failed' %}error{% else %}warning{% endif %} badge-sm">
          {{ scan.get_status_display }}
        </span>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <p class="text-base-content/60 text-center py-4 text-sm">No recent scans.</p>
  {% endif %}
</div>
