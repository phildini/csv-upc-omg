{% extends "base.html" %}

{% block title %}Scan UPC — csv-upc-omg{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold mb-6">Scan UPC</h1>

  <div class="card bg-base-100 shadow-sm mb-6 hover:shadow-md transition-shadow duration-200">
    <div class="card-body">
      <form id="scan-form" class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Enter UPC manually</span>
          </label>
          <div class="flex gap-2">
            <input type="text" id="upc-input" name="upc" placeholder="Enter UPC code" class="input input-bordered flex-1" />
            <button type="submit" class="btn btn-primary flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              Search
            </button>
          </div>
        </div>
      </form>

      <div id="result-area" class="mt-4">
        <!-- Results will be loaded here -->
      </div>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow duration-200">
    <div class="card-body">
      <h2 class="card-title mb-4">Recent Scans</h2>
      <div id="history-container">
        {% include "scan/_history_items.html" %}
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('scan-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const upc = document.getElementById('upc-input').value.trim();

  if (!upc) {
    return;
  }

  // Show loading indicator
  const resultArea = document.getElementById('result-area');
  resultArea.innerHTML = '<div class="text-center py-8"><div class="loading loading-spinner loading-md mx-auto"></div></div>';

  // Make AJAX request
  fetch('{% url "scan" %}', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
    },
    body: `upc=${encodeURIComponent(upc)}`
  })
  .then(response => response.text())
  .then(html => {
    resultArea.innerHTML = html;
  })
  .catch(error => {
    console.error('Error:', error);
    resultArea.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
  });
});

// Auto-refresh the scan history
function refreshScanHistory() {
  fetch('{% url "scan-history" %}', {
    headers: {
      'HX-Request': 'true'
    }
  })
  .then(response => response.text())
  .then(html => {
    document.getElementById('history-container').innerHTML = html;
  });
}

// Refresh every 30 seconds
setInterval(refreshScanHistory, 30000);

// Also refresh on page load
window.addEventListener('load', refreshScanHistory);
</script>
{% endblock %}
