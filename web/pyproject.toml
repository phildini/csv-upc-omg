[project]
name = "csv-upc-omg-web"
version = "0.1.0"
description = "Django web application for CSV UPC processing"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.11",
    "djangorestframework>=3.14",
    "django-tables2>=2.6",
    "django-filter>=23",
    "django-htmx>=1.17",
    "psycopg2-binary>=2.9",
    "gunicorn>=21",
    "whitenoise>=6.6",
    "django-debug-toolbar>=4.0",
    "django-tasks>=0.3,<1.0",
    "django-tailwind-cli>=4.6",
    "csv-upc-omg",
    "django-stagedoor>=0.2.0",
    "django-phonenumber-field>=7.0",
    "pillow>=10.0",
    "django-anymail>=15.0",
]

[tool.uv.sources]
csv-upc-omg = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["config/**/*", "inventory/**/*", "manage.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["migrations"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["inventory/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
DJANGO_SETTINGS_MODULE = "config.settings.dev"
