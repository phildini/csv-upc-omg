[project]
name = "csv-upc-omg-workspace"
version = "0.1.0"
description = "Workspace for CSV UPC processing library and Django web app"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["src", "web"]

[dependency-groups]
dev = [
    "coverage>=7.8.2",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.12",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["migrations", "src/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C4", "PTH"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["csv_upc_omg"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "web.*"
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--doctest-modules"
